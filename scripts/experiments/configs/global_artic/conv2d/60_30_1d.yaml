output_path: ./outputs/global_artic/60_30_1d
device: "cuda"

aiice:
  sea: null
  train_start_date: "1980-01-01"
  val_start_date: "2016-01-01"
  test_start_date: "2020-01-01"
  pre_history_len: 60
  forecast_len: 30
  step: 1d
  batch_size: 4
  threads: 4

run:
  model_name: conv2d
  seed: 42
  deterministic: true

  experiments:
    - kernel_size: [3, 3]
      lr: 0.0001
      max_epoch: 200
      patience: 20
      min_delta: 0.0001
