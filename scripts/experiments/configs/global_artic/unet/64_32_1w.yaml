output_path: ./outputs/global_artic/64_32_1w
device: "cuda"

aiice:
  sea: null
  train_start_date: "1980-01-01"
  val_start_date: "2016-01-01"
  test_start_date: "2020-01-01"
  pre_history_len: 64
  forecast_len: 32
  step: 1w
  batch_size: 4
  threads: 4

run:
  model_name: unet
  seed: 42
  deterministic: true

  experiments:
    - base_channels: 16
      depth: 3
      norm_groups: 8
      lr: 0.0001
      weight_decay: 0.000001
      max_epoch: 200
      patience: 20
      min_delta: 0.001
